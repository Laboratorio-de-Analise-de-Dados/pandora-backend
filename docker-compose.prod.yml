services:
  db:
    image: postgres:16
    container_name: pandora_db
    # Sem `ports:` — o banco só existe dentro da pandora_net (ADR-0024).
    # Publicar 5432 no host expõe o Postgres pra qualquer um que alcance
    # o IP de origem, mesmo com a Cloudflare na frente do domínio.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pandora_net

  pandora_web:
    # Imagem local — carregada via `docker load` pelo deploy (ADR-0024).
    # Sem registry: pull_policy never garante que o compose nunca tente
    # baixar nada; se a tag não existir no host, o deploy falha cedo.
    image: "pandora-backend:${IMAGE_TAG:-latest}"
    pull_policy: never
    container_name: pandora_web
    command: bash -c "python manage.py migrate && gunicorn pandora.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    expose:
      - "8000"
    depends_on:
      - db
    volumes:
      - uploads_data:/app/uploads
    environment:
      DEBUG: "${DEBUG}"
      SECRET_KEY: "${SECRET_KEY}"
      JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:-}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-api.project-pandora.com.br,localhost,127.0.0.1}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      CORS_ALLOW_ALL_ORIGINS: "${CORS_ALLOW_ALL_ORIGINS:-True}"
      DATABASE_NAME: "${POSTGRES_DB}"
      DATABASE_USER: "${POSTGRES_USER}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      DATABASE_HOST: "${DATABASE_HOST}"
      DATABASE_PORT: "${DATABASE_PORT}"
      EMAIL_HOST: "${EMAIL_HOST}"
      EMAIL_PORT: "${EMAIL_PORT}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL}"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET}"
      MICROSOFT_TENANT_ID: "${MICROSOFT_TENANT_ID}"
      MICROSOFT_REDIRECT_URI: "${MICROSOFT_REDIRECT_URI}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI}"
      MEDIA_ROOT: "/app/uploads"
    networks:
      - pandora_net

volumes:
  pgdata:
  uploads_data:

networks:
  pandora_net:
    driver: bridge
    external: true
