name: ↩️ Rollback Pandora Backend

# Redeploya uma tag já publicada (ADR-0022). Uso: Actions -> Rollback ->
# Run workflow -> informar a tag (ex.: v1.2.0). Cobre o caso "deploy
# passou no health check mas a feature veio errada".
#
# ATENÇÃO: rollback de código NÃO reverte migrations — só é seguro se a
# versão alvo for compatível com o schema atual (expand-contract).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da imagem a restaurar (ex.: v1.2.0)"
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production # mesmo portão manual do deploy
    steps:
      - name: Redeploy da tag ${{ inputs.tag }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          DATABASE_HOST: ${{ vars.DATABASE_HOST }}
          DATABASE_PORT: ${{ vars.DATABASE_PORT }}
          DEBUG: ${{ vars.DEBUG }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          CORS_ALLOW_ALL_ORIGINS: ${{ vars.CORS_ALLOW_ALL_ORIGINS }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          IMAGE_TAG: ${{ inputs.tag }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,DATABASE_HOST,DATABASE_PORT,DEBUG,SECRET_KEY,ALLOWED_HOSTS,CORS_ALLOWED_ORIGINS,CORS_ALLOW_ALL_ORIGINS,EMAIL_HOST_USER,EMAIL_HOST_PASSWORD,DOCKER_USER,DOCKER_TOKEN,IMAGE_TAG
          script: |
            set -e
            cd /opt/pandora/backend

            echo "🔑 Login no Docker Hub..."
            echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USER" --password-stdin

            echo "↩️  Restaurando $IMAGE_TAG..."
            export IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull pandora_web
            docker compose -f docker-compose.prod.yml up -d pandora_web

            echo "$IMAGE_TAG" > .deployed_version
            echo "✅ Rollback para $IMAGE_TAG concluído."
