name: ✅ CI Pandora Backend

# Roda em todo push/PR para a main: suíte de testes + check do Django.
# Build/deploy NÃO acontecem aqui — release é por tag (ver release.yml).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pandora_test
          POSTGRES_USER: pandora
          POSTGRES_PASSWORD: pandora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pandora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      DATABASE_NAME: pandora_test
      DATABASE_USER: pandora
      DATABASE_PASSWORD: pandora
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instala dependências
        run: pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Testes
        run: python manage.py test --noinput
