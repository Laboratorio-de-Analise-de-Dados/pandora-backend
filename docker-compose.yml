# Compose de DESENVOLVIMENTO local — não usar em produção.
# Os defaults abaixo existem só para o setup rodar zero-config; produção usa
# docker-compose.prod.yml com secrets/vars do CI.
services:
  db:
    image: postgres:18
    container_name: pandora_db
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-pandora_db}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-secret_pass}"
    ports:
      - 5432:5432
    volumes:
      # postgres:18+ usa layout versionado (data/18/docker); o volume monta
      # no diretório pai — não mudar para .../data ou o cluster não é achado
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pandora_net

  web:
    build:
      context: .
      args:
        SECRET_KEY: "${SECRET_KEY:-dev-insecure-secret-key}"
    container_name: pandora_web
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: pandora.settings
      SECRET_KEY: "${SECRET_KEY:-dev-insecure-secret-key}"
      DATABASE_NAME: "${POSTGRES_DB:-pandora_db}"
      DATABASE_USER: "${POSTGRES_USER:-postgres}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD:-secret_pass}"
      DATABASE_HOST: pandora_db
      DATABASE_PORT: 5432
      MEDIA_ROOT: "/app/uploads" # mesma pasta que o volume
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
    # migrate na subida é conveniência de dev; model novo pede migration
    # gerada + commitada: docker compose exec web python manage.py makemigrations
    command: bash -c 'while !</dev/tcp/db/5432; do sleep 1; done; python manage.py migrate && python manage.py runserver 0.0.0.0:8000'
    volumes:
      - .:/app
      - uploads_data:/app/uploads # pasta de uploads compartilhada
    stdin_open: true
    tty: true
    ports:
      - "${WEB_PORT:-8085}:8000"
    depends_on:
      - db
    networks:
      - pandora_net

volumes:
  db_data:
  uploads_data:
networks:
  pandora_net:
    driver: bridge
    external: true
