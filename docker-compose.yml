# Compose de DESENVOLVIMENTO local — não usar em produção.
# Os defaults abaixo existem só para o setup rodar zero-config; produção usa
# docker-compose.prod.yml com secrets/vars do CI.
services:
  db:
    image: postgres:16
    container_name: pandora_db
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-pandora_db}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-secret_pass}"
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pandora_net

  web:
    build:
      context: .
      args:
        SECRET_KEY: "${SECRET_KEY:-dev-insecure-secret-key}"
    container_name: pandora_web
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: pandora.settings
      SECRET_KEY: "${SECRET_KEY:-dev-insecure-secret-key}"
      DATABASE_NAME: "${POSTGRES_DB:-pandora_db}"
      DATABASE_USER: "${POSTGRES_USER:-postgres}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD:-secret_pass}"
      DATABASE_HOST: pandora_db
      DATABASE_PORT: 5432
      MEDIA_ROOT: "/app/uploads" # mesma pasta que o volume
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      # Juvia: serviço de ML interno (pandora_net). Só sobe com
      # `docker compose --profile juvia up` — ver serviço abaixo.
      JUVIA_URL: "${JUVIA_URL:-http://juvia:8000}"
      JUVIA_INTERNAL_TOKEN: "${JUVIA_INTERNAL_TOKEN:-dev-token}"
    # migrate na subida é conveniência de dev. Migration NÃO é gerada na
    # subida: o check abaixo só avisa; o gate duro está no Dockerfile
    # (build falha). Gerar: docker compose exec web python manage.py makemigrations
    command: 'bash -c "while !</dev/tcp/db/5432; do sleep 1; done; python manage.py migrate && (python manage.py makemigrations --check --dry-run || echo ATENCAO: model mudou sem migration. Rode: docker compose exec web python manage.py makemigrations) && python manage.py runserver 0.0.0.0:8000"'
    volumes:
      - .:/app
      - uploads_data:/app/uploads # pasta de uploads compartilhada
    stdin_open: true
    tty: true
    ports:
      - "${WEB_PORT:-8085}:8000"
    depends_on:
      - db
    networks:
      - pandora_net

  # Opcional: sobe o Juvia a partir do clone local do repo irmão.
  # Uso: docker compose --profile juvia up --build
  # Espera ../juvia-project existir (mesmo diretório-pai dos clones).
  juvia:
    profiles: ["juvia"]
    build:
      context: ../juvia-project
      dockerfile: Dockerfile.dev
    container_name: juvia
    environment:
      JUVIA_INTERNAL_TOKEN: "${JUVIA_INTERNAL_TOKEN:-dev-token}"
    volumes:
      - ../juvia-project:/app
    ports:
      - "127.0.0.1:${JUVIA_PORT:-8001}:8000"
    networks:
      - pandora_net

volumes:
  db_data:
  uploads_data:
networks:
  pandora_net:
    driver: bridge
    external: true
